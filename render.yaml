services:
  - type: web
    name: arthub-backend
    runtime: go
    rootDir: backend
    buildCommand: go build -o server .
    startCommand: ./server
    envVars:
      - key: PORT
        value: 8080
      - key: ARTHUB_ALLOWED_ORIGINS
        sync: false
      - key: ARTHUB_COOKIE_SECURE
        value: "true"
      - key: ARTHUB_COOKIE_SAMESITE
        value: none
      - key: DB_PATH
        sync: false
